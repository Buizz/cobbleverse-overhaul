<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>퀘스트 관리 · Cobbleventure</title>
  <link rel="stylesheet" href="/typography.css">
  <link rel="stylesheet" href="/quest-editor.css">
  <link rel="stylesheet" href="/quest-conditions.css">
  <link rel="stylesheet" href="/studio-tool-shell.css">
  <link rel="stylesheet" href="/save-bars.css">
  <link rel="stylesheet" href="/form-controls.css">
  <script>document.documentElement.classList.toggle("is-embedded", new URLSearchParams(location.search).get("embedded") === "1");</script>
</head>
<body>
  <header class="topbar">
    <div><p>COBBLEVENTURE CONTENT MANAGER</p><h1>퀘스트 관리</h1></div>
    <nav><a href="/">전체 관리</a><a href="/quest-global.html">전역 발동</a><a href="/main-quest-flow.html">진행 순서</a><a href="/cves.html">이벤트 스크립트 V5</a></nav>
  </header>
  <main>
    <aside>
      <div class="aside-head"><strong>퀘스트</strong><button id="new-quest">새 퀘스트</button></div>
      <input id="quest-search" placeholder="이름 또는 ID 검색">
      <div id="quest-list" class="quest-list"></div>
    </aside>
    <section class="editor">
      <header class="editor-head"><div><small id="quest-path">새 문서</small><h2 id="editor-title">퀘스트 편집</h2></div><button id="save-quest" class="primary">저장</button></header>
      <div id="issues" class="issues" hidden></div>
      <form id="quest-form">
        <fieldset><legend>기본 정보</legend>
          <label><span>퀘스트 ID</span><input name="id" placeholder="cobbleventure:quest/main/get_cut" required></label>
          <label><span>종류</span><select name="category"><option value="main">메인</option><option value="side">서브</option><option value="tutorial">안내</option></select></label>
          <label><span>한국어 이름</span><input name="nameKo" required></label>
          <label><span>영문 이름</span><input name="nameEn"></label>
          <label class="wide"><span>한국어 설명</span><textarea name="summaryKo" rows="3" required></textarea></label>
          <label class="wide"><span>영문 설명</span><textarea name="summaryEn" rows="3"></textarea></label>
          <label class="toggle"><input name="enabled" type="checkbox" checked><span>사용</span></label>
        </fieldset>
        <fieldset><legend>부여 조건</legend>
          <label><span>조건 방식</span><select name="acceptMode"><option value="all">모두 만족</option><option value="any">하나 이상 만족</option></select></label>
          <section class="gate-condition-builder wide" id="quest-accept-conditions">
            <header><span>부여 조건</span><button type="button" data-gate-condition-add>+ 조건 추가</button></header>
            <div class="gate-condition-list" data-gate-condition-list></div>
          </section>
        </fieldset>
        <fieldset><legend>목표</legend>
          <div class="wide objective-toolbar"><span>목표별 안내와 달성 조건</span><button type="button" id="add-objective">+ 목표 추가</button></div>
          <div class="wide" id="quest-objectives"></div>
        </fieldset>
        <fieldset><legend>완료 설정</legend>
          <label><span>완료 방식</span><select name="completionMode"><option value="npc_turn_in">NPC에게 보고</option><option value="automatic">조건 충족 시 자동 완료</option></select></label>
        </fieldset>
        <fieldset><legend>V5 이벤트 연결</legend>
          <p class="wide">기존 대화·배틀이 끝난 뒤 플레이어별 대기열에서 실행합니다. 각 훅은 최초 1회만 등록됩니다. 기준 NPC가 현재 차원에 로드되어야 실행됩니다.</p>
          <div class="wide"><button type="button" id="refresh-hook-events">이벤트 목록 새로고침</button> <button type="button" id="open-hook-library">이벤트 라이브러리 열기</button></div>
          <div class="wide" id="quest-accept-event"></div>
          <div class="wide" id="quest-complete-event"></div>
          <small class="wide">사용자 정의 원본에 인수 없는 <code>event quest { … }</code> 진입점을 하나 작성하세요. 상호작용·거리 진입점은 퀘스트 훅으로 호출하지 않습니다.</small>
        </fieldset>
      </form>
    </section>
  </main>
  <datalist id="declared-variable-ids"></datalist>
  <datalist id="declared-item-ids"></datalist>
  <script src="/player-condition-editor.js"></script>
  <script src="/quest-editor.js"></script>
</body>
</html>
