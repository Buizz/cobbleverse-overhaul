plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'cobbleventure-player-menu'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    compileOnly "maven.modrinth:cobblemon:${cobblemon_maven_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

processResources {
    def properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        cobblemon_version: cobblemon_version,
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
    from(rootProject.file('../../content/worlds')) {
        into 'data/cobbleventure_player_menu/map'
        include 'generation_*.json'
    }
    from(rootProject.file('../../content/settlements')) {
        into 'data/cobbleventure_player_menu/map/settlements'
        include 'generation_*/*.json'
    }
    from(rootProject.file('../../content/catalogs/biome-profiles.json')) {
        into 'data/cobbleventure_player_menu/map/catalogs'
    }
    from(rootProject.file('../../content/catalogs/pokemon-habitats.json')) {
        into 'data/cobbleventure_player_menu/map/catalogs'
    }
}

tasks.register('cleanInstalledDevelopmentJars', Delete) {
    delete fileTree(rootProject.file('../../pack/overrides/development-placeholder/mods')) {
        include 'cobbleventure-player-menu-*.jar'
    }
}

tasks.register('installDevelopmentJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledDevelopmentJars'
    from jar
    into rootProject.file('../../pack/overrides/development-placeholder/mods')
}

tasks.named('build') {
    finalizedBy 'installDevelopmentJar'
}
