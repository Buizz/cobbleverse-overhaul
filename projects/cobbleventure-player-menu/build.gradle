import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

def fieldMoveNpcMapFile = layout.buildDirectory.file('generated/field-move-map/field-move-npcs.json')
def bagConditionMapFile = layout.buildDirectory.file('generated/bag-conditions/bag-conditions.json')
def contentProjectDir = file(System.getenv('COBBLEVENTURE_PROJECT_PATH') ?: rootProject.file('../../content-projects/cobbleventure-main'))
def contentDir = new File(contentProjectDir, 'content')

tasks.register('generateFieldMoveNpcMap') {
    def npcSources = fileTree(new File(contentDir, 'source')) { include '**/*.json' }
    def settlements = fileTree(new File(contentDir, 'settlements')) { include 'generation_*/*.json' }
    inputs.files(npcSources, settlements)
    outputs.file(fieldMoveNpcMapFile)
    doLast {
        def parser = new JsonSlurper()
        def profiles = [:]
        npcSources.files.sort().each { file ->
            def npc = parser.parse(file)
            def moves = (npc.events ?: []).collectMany { event ->
                (event.commands ?: []).findAll { it.type == 'grant_field_move' }.collect { it.move }
            }.findAll { it }.unique()
            if (npc.id && moves) {
                profiles[npc.id] = [
                    name: npc.npc?.display_name?.ko_kr ?: npc.name?.ko_kr ?: npc.id,
                    moves: moves,
                ]
            }
        }

        def bySettlement = [:]
        settlements.files.sort().each { file ->
            def settlement = parser.parse(file)
            def profileIds = (settlement.npc_placement?.trainer_slots ?: []).collectMany { slot ->
                (slot.members ?: []).collect { it.npc_profile }
            }.findAll { it }.unique()
            def entries = profileIds.findAll { profiles.containsKey(it) }.collect { profiles[it] }
            if (settlement.id && entries) bySettlement[settlement.id] = entries
        }

        def output = fieldMoveNpcMapFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([settlements: bySettlement])) + System.lineSeparator(), 'UTF-8')
    }
}

tasks.register('generateBagConditionMap') {
    def contentJson = fileTree(contentDir) { include '**/*.json' }
    inputs.files(contentJson)
    outputs.file(bagConditionMapFile)
    doLast {
        def parser = new JsonSlurper()
        def conditions = [:]
        def canonical
        canonical = { value ->
            if (value instanceof Map) {
                return value.keySet().sort().collectEntries { key -> [(key): canonical(value[key])] }
            }
            if (value instanceof Collection) return value.collect { canonical(it) }
            return value
        }
        def objectiveFor = { prefix, key ->
            byte[] digest = java.security.MessageDigest.getInstance('SHA-1')
                .digest(key.getBytes(java.nio.charset.StandardCharsets.UTF_8))
            String hash = digest.collect { String.format('%02x', it & 0xff) }.join()
            prefix + hash.substring(0, 12)
        }
        def visit
        visit = { value ->
            if (value instanceof Map) {
                if (value.type in ['item', 'has_item'] && value.item instanceof String) {
                    int count = Math.max(1, (value.count ?: 1) as int)
                    String key = value.item + '\u0000' + count
                    String objective = objectiveFor('cvi_', key)
                    conditions[objective] = [type: 'item', item: value.item, count: count]
                } else if (value.type in ['variable', 'badge', 'pokemon', 'party_count']) {
                    String normalized = JsonOutput.toJson(canonical(value))
                    String objective = objectiveFor('cvc_', normalized)
                    conditions[objective] = value
                }
                value.values().each { visit(it) }
            } else if (value instanceof Collection) {
                value.each { visit(it) }
            }
        }
        contentJson.files.sort().each { file -> visit(parser.parse(file)) }

        def output = bagConditionMapFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([conditions: conditions]))
            + System.lineSeparator(), 'UTF-8')
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'cobbleventure-player-menu'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    compileOnly "maven.modrinth:cobblemon:${cobblemon_maven_version}"
    compileOnly "curse.maven:cobbledollars-859232:8484919"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

processResources {
    dependsOn tasks.named('generateFieldMoveNpcMap')
    dependsOn tasks.named('generateBagConditionMap')
    def properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        cobblemon_version: cobblemon_version,
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
    from(new File(contentDir, 'worlds')) {
        into 'data/cobbleventure_player_menu/map'
        include 'generation_*.json'
    }
    from(new File(contentDir, 'settlements')) {
        into 'data/cobbleventure_player_menu/map/settlements'
        include 'generation_*/*.json'
    }
    from(new File(contentDir, 'caves')) {
        into 'data/cobbleventure_player_menu/map/caves'
        include 'generation_*/*.json'
    }
    from(new File(contentDir, 'forests')) {
        into 'data/cobbleventure_player_menu/map/forests'
        include 'generation_*/*.json'
    }
    from(new File(contentDir, 'catalogs/biome-profiles.json')) {
        into 'data/cobbleventure_player_menu/map/catalogs'
    }
    from(new File(contentDir, 'catalogs/pokemon-habitats.json')) {
        into 'data/cobbleventure_player_menu/map/catalogs'
    }
    from(new File(contentDir, 'catalogs/league-progression.json')) {
        into 'data/cobbleventure_player_menu/league'
    }
    from(new File(contentDir, 'catalogs/badges.json')) {
        into 'data/cobbleventure_player_menu/league'
    }
    from(new File(contentDir, 'catalogs/gyms.json')) {
        into 'data/cobbleventure_player_menu/league'
    }
    from(new File(contentDir, 'source/trainers/gym_leaders')) {
        into 'data/cobbleventure_player_menu/league/npcs'
        include '*.json'
    }
    from(fieldMoveNpcMapFile) {
        into 'data/cobbleventure_player_menu/map'
    }
    from(bagConditionMapFile) {
        into 'data/cobbleventure_player_menu/bag'
    }
}

tasks.register('cleanInstalledDevelopmentJars', Delete) {
    delete fileTree(rootProject.file('../../pack/overrides/development-placeholder/mods')) {
        include 'cobbleventure-player-menu-*.jar'
    }
}

tasks.register('installDevelopmentJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledDevelopmentJars'
    from jar
    into rootProject.file('../../pack/overrides/development-placeholder/mods')
}

tasks.named('build') {
    finalizedBy 'installDevelopmentJar'
}
