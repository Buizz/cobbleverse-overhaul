modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="cobbleventure_bootstrap"
version="${mod_version}"
displayName="${mod_name}"
authors="Buizz"
description='''
Finds a plains biome, moves the world spawn there, and places the Cobbleventure starter town.
'''

[[mixins]]
config="cobbleventure_bootstrap.mixins.json"

[[dependencies.cobbleventure_bootstrap]]
modId="cobbleventure_adventure"
type="required"
versionRange="[0.1.0,0.2)"
ordering="AFTER"
side="BOTH"

[[dependencies.cobbleventure_bootstrap]]
modId="cobbleventure_player_menu"
type="required"
versionRange="[1.5.1,1.6)"
ordering="AFTER"
side="BOTH"

[[dependencies.cobbleventure_bootstrap]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.cobbleventure_bootstrap]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.cobbleventure_bootstrap]]
modId="cobblemon"
type="required"
versionRange="${cobblemon_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.cobbleventure_bootstrap]]
modId="cobbledollars"
type="required"
versionRange="[2.0.0,)"
ordering="AFTER"
side="BOTH"
