plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'cobbleventure-pokefinder'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    compileOnly "dev.buizz.cobbleventure:cobbleventure-player-menu:1.6.0"
    compileOnly "curse.maven:cobblemon-687131:7553231"
    compileOnly "curse.maven:cobblenav-976014:7940651"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

def integrationModsPath = providers.gradleProperty('integration_mods_dir')
    .orElse(providers.environmentVariable('COBBLEVENTURE_INTEGRATION_MODS_DIR'))
    .orNull
if (integrationModsPath != null && !integrationModsPath.isBlank()) {
    def integrationModsDirectory = file(integrationModsPath)
    dependencies {
        localRuntime fileTree(integrationModsDirectory) {
            include '*.jar'
            exclude 'cobbleventure-pokefinder-*.jar'
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'cobbleventure.pokefinder.testMarker',
                System.getProperty('cobbleventure.pokefinder.testMarker', 'false')
            systemProperty 'cobbleventure.pokefinder.visualRegression',
                System.getProperty('cobbleventure.pokefinder.visualRegression', 'false')
        }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
    addModdingDependenciesTo sourceSets.test
}

processResources {
    def properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        cobblenav_version_range: cobblenav_version_range,
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.register('cleanInstalledDevelopmentJars', Delete) {
    delete fileTree(rootProject.file('../../pack/overrides/development-placeholder/mods')) {
        include 'cobbleventure-pokefinder-*.jar'
    }
}

tasks.register('installDevelopmentJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledDevelopmentJars'
    from jar
    into rootProject.file('../../pack/overrides/development-placeholder/mods')
}

tasks.named('build') {
    finalizedBy 'installDevelopmentJar'
}
