plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'cobbleventure-theme-blocks'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

processResources {
    def properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }

    // Blockbench 작업장은 JAR 소스 트리 밖에 둔다. 빌드할 때 게임에서 실제로
    // 사용하는 모델 JSON과 텍스처 PNG만 최종 리소스에 합친다.
    from('object-workspace') {
        include 'assets/cobbleventure_theme_blocks/models/block/workshop/**/*.json'
        include 'assets/cobbleventure_theme_blocks/textures/block/**/*.png'
        exclude 'assets/cobbleventure_theme_blocks/textures/block/windows/**/*.png'
        // The research device source atlas stays editable outside the JAR;
        // only the generated *_1_texture.png atlas is a runtime resource.
        exclude 'assets/cobbleventure_theme_blocks/textures/block/research_device.png'
        exclude 'assets/cobbleventure_theme_blocks/models/block/workshop/**/*_complete.json'
        exclude 'assets/cobbleventure_theme_blocks/models/block/workshop/**/*.pack-report.json'
    }
}

def pythonExecutable = providers.environmentVariable('PYTHON').orElse(
    System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'
)

tasks.register('syncEditableBbModels', Exec) {
    workingDir projectDir
    commandLine pythonExecutable.get(), 'object-workspace/sync-editable-bbmodels.py'
}

tasks.named('processResources') {
    dependsOn 'syncEditableBbModels'
}

tasks.register('cleanInstalledThemeBlockJars', Delete) {
    [
        rootProject.file('../../pack/overrides/development-placeholder/mods'),
        rootProject.file('../../pack/overrides/structure-builder/mods'),
        rootProject.file('../../pack/overrides/live-nbt-editor/mods'),
    ].each { directory ->
        delete fileTree(directory) {
            include 'cobbleventure-theme-blocks-*.jar'
        }
    }
}

tasks.register('installDevelopmentPackJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledThemeBlockJars'
    from jar
    into rootProject.file('../../pack/overrides/development-placeholder/mods')
}

tasks.register('installStructureBuilderJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledThemeBlockJars'
    from jar
    into rootProject.file('../../pack/overrides/structure-builder/mods')
}

tasks.register('installLiveEditorJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledThemeBlockJars'
    from jar
    into rootProject.file('../../pack/overrides/live-nbt-editor/mods')
}

tasks.register('installThemeBlockJars') {
    dependsOn 'installDevelopmentPackJar'
    dependsOn 'installStructureBuilderJar'
    dependsOn 'installLiveEditorJar'
}

tasks.named('build') {
    finalizedBy 'installThemeBlockJars'
}
